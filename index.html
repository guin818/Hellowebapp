<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Gowun Batang Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gowun Batang', serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            overflow: hidden;
            user-select: none;
        }

        /* Floating Particle Styles */
        .floating-particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.2);
            }
        }

        /* Ripple Animation */
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            transform: scale(0);
            animation: ripple-effect 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* Ambient Glow Effect */
        .glow-text {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3),
                         0 0 40px rgba(168, 85, 247, 0.4),
                         0 0 80px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative cursor-pointer select-none">

    <!-- Interactive Glowing Text Container -->
    <div class="relative z-10 text-center px-4">
        <h1 id="text" class="glow-text text-8xl sm:text-9xl md:text-[12rem] font-bold tracking-widest text-white transition-all duration-300 hover:scale-105 active:scale-95">
            안녕
        </h1>
    </div>

    <!-- Canvas for Ambient Background Effect -->
    <canvas id="bgCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

    <script>
        // Canvas Particle Background
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class BackgroundParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize Background Particles
        for (let i = 0; i < 60; i++) {
            particles.push(new BackgroundParticle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Click / Touch Interaction Events
        window.addEventListener('click', (e) => {
            createRipple(e.clientX, e.clientY);
            createFloatingSparkles(e.clientX, e.clientY);
        });

        // Create Ripple Effect
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const size = Math.max(window.innerWidth, window.innerHeight) * 0.25;
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x - size / 2}px`;
            ripple.style.top = `${y - size / 2}px`;

            document.body.appendChild(ripple);

            setTimeout(() => ripple.remove(), 800);
        }

        // Create Floating Sparkles
        function createFloatingSparkles(x, y) {
            const colors = ['#f472b6', '#c084fc', '#38bdf8', '#fde047'];
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'floating-particle';
                const size = Math.random() * 8 + 4;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 60;
                p.style.left = `${x + offsetX}px`;
                p.style.top = `${y + offsetY}px`;

                const duration = Math.random() * 0.6 + 0.6;
                p.style.animationDuration = `${duration}s`;

                document.body.appendChild(p);
                setTimeout(() => p.remove(), duration * 1000);
            }
        }
    </script>
</body>
</html>
